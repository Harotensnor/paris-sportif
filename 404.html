<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Paris-Sportif</title>
<meta name="description" content="Cette page n'existe pas. Retour aux pronostics multi-sports.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #17171b;
    --text: #ededef;
    --text-dim: #9ca3af;
    --brand: #a78bfa;
    --accent: #10b981;
    --border: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .num {
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    margin: 0 0 10px;
    background: linear-gradient(135deg, var(--brand), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -.03em;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 12px;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-dim);
    margin: 0 0 24px;
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: transform .12s, background .15s;
    border: 1px solid transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--brand);
    color: #08080a;
  }
  .btn-primary:hover { background: #b89cff; }
  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: #20202a; }
  .links {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
  }
  .links a {
    color: var(--brand);
    text-decoration: none;
    margin: 0 8px;
  }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="container">
    <div class="num">404</div>

    <div class="actions">
      <a class="btn btn-primary" href="/">🏠 Accueil</a>
      <a class="btn btn-secondary" href="/pronostics.html">📊 Voir les pronos</a>
    </div>
    <div class="links">
      <a href="/methodologie.html">Méthodologie</a>·
      <a href="/backtest.html">Backtest</a>·
      <a href="/academie.html">Académie</a>·
      <a href="/legal.html">Légal</a>·
      <a href="https://github.com/Harotensnor/paris-sportif">GitHub</a>
    </div>
  </main>
</body>
</html>
