name: synthetic-monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synthetic site check
        env:
          QA_MONITOR_URL: https://harotensnor.github.io/paris-sportif/pronostics.html
          QA_MONITOR_MAX_MS: '2000'
        run: python scripts/synthetic_monitor.py

      - name: Upload synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-monitor-report
          path: synthetic-monitor-report.json
          retention-days: 14
