name: qa-gates

on:
  push:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'app.js'
      - 'app.css'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/qa-gates.yml'
  pull_request:
    paths:
      - 'pronostics.html'
      - 'app.js'
      - 'app.css'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/qa-gates.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: qa-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-gates:
    name: gates ${{ matrix.os }} node-${{ matrix.node }} py-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python deps
        run: python -m pip install -r pip-requirements.txt

      - name: Run strict local quality gates
        env:
          QA_STRICT_FRESHNESS: '0'
        run: python scripts/qa_quality_gate.py

      - name: Build QA HTML report
        if: always()
        run: python scripts/qa_html_report.py

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ matrix.os }}-node${{ matrix.node }}-py${{ matrix.python }}
          path: |
            qa-*-report.json
            analytics_local_privacy_audit.json
            privacy_network_audit.json
            qa-report/
          retention-days: 14

  browser-regression:
    name: browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test deps
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium firefox webkit

      - name: E2E core flows cross-browser
        run: |
          npx playwright test tests/critical-flows.spec.js tests/local-analytics.spec.js \
            --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop \
            --reporter=list,html

      - name: A11y regression
        run: node scripts/a11y_audit.js

      - name: Visual regression matrix
        run: node scripts/qa_visual_regression.js

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-regression
          path: |
            playwright-report/
            a11y-report.json
            qa-visual-report.json
            qa-report/visual/
          retention-days: 14
