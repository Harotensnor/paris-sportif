name: qa-gates

on:
  push:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'sw.js'
      - 'legacy-app.js'
      - 'app-enhancements.js'
      - 'app-i18n.js'
      - 'src/**'
      - 'scripts/**'
      - 'scripts/audit_asset_hashes.py'
      - 'scripts/audit_all_probes_wired.py'
      - 'backtest_strategies.json'
      - 'backtest_report_v2.json'
      - 'prob_calibration.json'
      - 'tier_calibration.json'
      - 'calibration_method.json'
      - 'calibration_method.js'
      - 'tests/**'
      - '.github/workflows/qa-gates.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/synthetic-monitor.yml'
      - '.github/workflows/post-deploy-health.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'sw.js'
      - 'legacy-app.js'
      - 'app-enhancements.js'
      - 'app-i18n.js'
      - 'src/**'
      - 'scripts/**'
      - 'scripts/audit_asset_hashes.py'
      - 'scripts/audit_all_probes_wired.py'
      - 'backtest_strategies.json'
      - 'backtest_report_v2.json'
      - 'prob_calibration.json'
      - 'tier_calibration.json'
      - 'calibration_method.json'
      - 'calibration_method.js'
      - 'tests/**'
      - '.github/workflows/qa-gates.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/smoke.yml'
      - '.github/workflows/synthetic-monitor.yml'
      - '.github/workflows/post-deploy-health.yml'
  workflow_dispatch: {}

concurrency:
  group: qa-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: qa ${{ matrix.os }} py${{ matrix.python-version }} node${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python test runner
        run: python -m pip install pytest

      # v50.3 — Audit 2026-05-09 : v49.9 a déployé legacy-app.js avec une SyntaxError
      # (await dans handler non-async ligne 4651). Le site est resté cassé ~30 min
      # parce qu'aucun check syntaxe ne tournait avant deploy. Maintenant : node --check
      # sur les bundles JS critiques en premier, et c'est BLOQUANT (fail-fast).
      - name: JS syntax check (fail fast)
        run: |
          echo "Validating JS syntax for critical bundles..."
          node --check legacy-app.js && echo "  legacy-app.js OK"
          node --check app.js && echo "  app.js OK"
          node --check sw.js && echo "  sw.js OK"
          if [ -f app-enhancements.js ]; then node --check app-enhancements.js && echo "  app-enhancements.js OK"; fi
          if [ -f app-i18n.js ]; then node --check app-i18n.js && echo "  app-i18n.js OK"; fi
          echo "All JS bundles syntax OK"

      # v50.4 — Audit 2026-05-09 : v50.0/v50.3 ont trouvé 3 schema mismatches
      # silencieux (team_stats, footballdata, nba_team_stats) — coverage 0% pendant
      # des semaines parce qu'aucun gate ne validait que les patchers lisaient les
      # bonnes clés. audit_patch_contracts.py compare expected vs actual et fail-fast.
      - name: Patch source contract audit (fail fast)
        run: python scripts/audit_patch_contracts.py --strict
        continue-on-error: true  # informatif pour l'instant, peut devenir bloquant après stabilisation

      - name: Fast QA gate
        run: python scripts/qa_gate_report.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .cache/qa-gates-report.json
            .cache/qa-gates-report.html
          retention-days: 14
