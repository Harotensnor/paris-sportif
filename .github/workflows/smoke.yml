name: smoke-e2e

# Fait tourner un headless Chromium sur chaque push vers main (et chaque PR),
# ouvre pronostics.html, clique toutes les pages et capte les erreurs JS.
# Bloque les régressions type TDZ avant qu'elles n'arrivent en prod.

on:
  push:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'sw.js'
      - 'scripts/smoke_e2e.js'
      - 'scripts/probe_all_pages.js'
      - 'scripts/probe_tous_modal.js'
      - 'scripts/probe_table_deep.js'
      - 'scripts/probe_table_combos.js'
      - 'scripts/probe_modal_sports.js'
      - 'scripts/probe_nav_chain.js'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'sw.js'
      - 'legacy-app.js'
      - 'scripts/probe_all_pages.js'
      - 'scripts/probe_tous_modal.js'
      - 'scripts/probe_table_deep.js'
      - 'scripts/probe_table_combos.js'
      - 'scripts/probe_modal_sports.js'
      - 'scripts/probe_nav_chain.js'
  workflow_dispatch: {}

concurrency:
  group: smoke-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright
        run: |
          npm init -y
          npm install --no-save playwright@1

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke
        run: node scripts/smoke_e2e.js

      - name: Run page probe (every route, desktop + mobile)
        # v37.031 — visits 17 routes × 2 viewports + 7 perf sub-tabs.
        # Asserts no JS errors, no overflow, content actually mounted.
        run: node scripts/probe_all_pages.js

      - name: Run modal/helpers probe
        # v37.031 — drills the Tous filter pipeline, the detail modal +
        # its 6 tabs, and the public window.* helper surface.
        run: node scripts/probe_tous_modal.js

      - name: Run deep table probe (Tous sub-tabs, math, modal coherence)
        # v37.037 — validates that every visible row in the Tous table
        # has coherent edge / EV math (rounding within 1.5pt), the
        # sub-tab badges match the rendered count (catches the
        # "En cours (0) → 194 pending shown" regression v37.037 fixed),
        # row click opens a modal whose content matches the row, and
        # the search input + sport-filter persistence survive a reload.
        run: node scripts/probe_table_deep.js

      - name: Run combinatorial table probe (preset × sport × sub-tab)
        # v37.046 — walks every (preset × sport × sub-tab) combo and
        # asserts rendered count <= badge count for each, with zero
        # console errors. 72 combos in current schema. Catches drift
        # between the badge math and what the renderer actually paints.
        run: node scripts/probe_table_combos.js

      - name: Run modal sports probe (per-sport detail modal)
        # v37.046 — opens the detail modal on one match per sport in
        # the current dataset (football, hockey, basketball, baseball,
        # tennis when available) and clicks every modal tab. Catches
        # sport-specific render errors (basketball stats panel,
        # baseball pitcher block) before they ship.
        run: node scripts/probe_modal_sports.js

      - name: Run navigation chain probe
        # v37.049 — walks the full user flow (dashboard → modal → close
        # → revived routes → suivi sub-nav → reload → page-btn active).
        # Caught the v37.049 _histFilters crash (legacy historique path
        # references an undeclared variable) and the v37.048 hash sync
        # bug.
        run: node scripts/probe_nav_chain.js
