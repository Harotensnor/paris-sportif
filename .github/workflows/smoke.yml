name: smoke-e2e

# Fait tourner un headless Chromium sur chaque push vers main (et chaque PR),
# ouvre pronostics.html, clique toutes les pages et capte les erreurs JS.
# Bloque les régressions type TDZ avant qu'elles n'arrivent en prod.

on:
  push:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'sw.js'
      - 'scripts/smoke_e2e.js'
      - 'scripts/probe_all_pages.js'
      - 'scripts/probe_tous_modal.js'
      - 'scripts/probe_table_deep.js'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'sw.js'
      - 'legacy-app.js'
      - 'scripts/probe_all_pages.js'
      - 'scripts/probe_tous_modal.js'
      - 'scripts/probe_table_deep.js'
  workflow_dispatch: {}

concurrency:
  group: smoke-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright
        run: |
          npm init -y
          npm install --no-save playwright@1

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke
        run: node scripts/smoke_e2e.js

      - name: Run page probe (every route, desktop + mobile)
        # v37.031 — visits 17 routes × 2 viewports + 7 perf sub-tabs.
        # Asserts no JS errors, no overflow, content actually mounted.
        run: node scripts/probe_all_pages.js

      - name: Run modal/helpers probe
        # v37.031 — drills the Tous filter pipeline, the detail modal +
        # its 6 tabs, and the public window.* helper surface.
        run: node scripts/probe_tous_modal.js

      - name: Run deep table probe (Tous sub-tabs, math, modal coherence)
        # v37.037 — validates that every visible row in the Tous table
        # has coherent edge / EV math (rounding within 1.5pt), the
        # sub-tab badges match the rendered count (catches the
        # "En cours (0) → 194 pending shown" regression v37.037 fixed),
        # row click opens a modal whose content matches the row, and
        # the search input + sport-filter persistence survive a reload.
        run: node scripts/probe_table_deep.js
