name: e2e-tests

# Run Playwright critical-flow tests on PRs and pushes to main.
# Catches regressions in nav/theme/filter bar before they ship to GH Pages.
on:
  push:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'pronostics.html'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + browsers
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium-desktop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
