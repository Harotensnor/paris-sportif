name: e2e-tests

# Run Playwright critical-flow tests on PRs and pushes to main.
# Catches regressions in nav/theme/filter bar before they ship to GH Pages.
# Also runs the pipeline drift checker (auto_refresh.py vs refresh.yml).
on:
  push:
    branches: [main]
    paths:
      - 'pronostics.html'
      - 'legacy-app.js'
      - 'app.js'
      - 'app.css'
      - 'app-enhancements.js'
      - 'app-i18n.js'
      - 'src/**'
      - 'vendor/**'
      - 'backtest_strategies.json'
      - 'backtest_report_v2.json'
      - 'prob_calibration.json'
      - 'tier_calibration.json'
      - 'calibration_method.json'
      - 'calibration_method.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e.yml'
      - 'auto_refresh.py'
      - '.github/workflows/refresh.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'pronostics.html'
      - 'legacy-app.js'
      - 'app.js'
      - 'app.css'
      - 'app-enhancements.js'
      - 'app-i18n.js'
      - 'src/**'
      - 'vendor/**'
      - 'backtest_strategies.json'
      - 'backtest_report_v2.json'
      - 'prob_calibration.json'
      - 'tier_calibration.json'
      - 'calibration_method.json'
      - 'calibration_method.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/e2e.yml'
      - 'auto_refresh.py'
      - '.github/workflows/refresh.yml'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    # Très rapide (~5s), bloque la CI si auto_refresh.py et refresh.yml
    # divergent. Évite les "marche en local mais pas en prod" sournois.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check pipeline drift
        run: python3 scripts/check_pipeline_drift.py
      - name: Check no conflict markers (anti-rebase-fail safety)
        run: python3 scripts/check_no_conflict_markers.py
      - name: Check CSP inline script hashes (v37.028)
        # Each inline <script> in pronostics.html must have its SHA-256
        # listed in the meta CSP. Catches the v37.025 regression where
        # editing a comment inside an inline script silently broke its
        # hash and made the script fail to execute under strict CSP.
        run: python3 scripts/audit_csp_inline_hashes.py
      - name: Check health.json quality_checks (sprint 1 #4)
        run: python3 scripts/check_health_quality.py
      - name: Check bundle size budget (sprint 6 #30)
        run: python3 scripts/check_bundle_size.py
      - name: MCP tools smoke test (v33.22)
        run: python3 scripts/test_mcp_smoke.py
      - name: innerHTML sink + fetch tracking + UX clarity audits
        # v37.036 — these static audits used to run only locally. Wiring
        # them into drift catches regressions in legacy-app.js that the
        # smoke E2E only exposes after a full Chromium boot (slower).
        # v37.044 — added orphan renderers detector.
        # v37.050 — added localStorage corruption-safety static audit.
        run: |
          python3 scripts/audit_innerhtml_safety.py
          python3 scripts/audit_fetch_tracking.py
          python3 scripts/audit_ux_clarity.py
          python3 scripts/audit_playwright_skips.py
          python3 scripts/audit_intelligence_consistency.py
          python3 scripts/audit_legacy_comments.py
          python3 scripts/audit_local_analytics.py
          python3 scripts/audit_privacy_features.py
          python3 scripts/audit_orphan_renderers.py
          python3 scripts/audit_localstorage_safety.py
          python3 scripts/audit_no_unused_imports.py
          python3 scripts/audit_no_legacy_imports.py
          python3 scripts/audit_no_dead_pronos_subnav.py
          python3 scripts/audit_no_dead_top_page.py
          python3 scripts/audit_no_dead_sports_grid.py
          python3 scripts/audit_no_prod_console_log.py
          python3 scripts/audit_no_direct_console_modules.py
          python3 scripts/audit_no_todo_markers.py
          python3 scripts/audit_no_empty_catch_modules.py
          python3 scripts/audit_smoke_workflow_triggers.py
          python3 scripts/audit_workflow_self_triggers.py
          python3 scripts/audit_qa_runtime_privacy.py
          python3 scripts/audit_ci_critical_paths.py
          python3 scripts/audit_qa_workflows.py
          python3 scripts/audit_modal_aria.py
      - name: Pytest (Python unit tests)
        # v37.036 — pytest covers data-quality classifiers, the multi-strategy
        # backtest math, the calibration maps and the historique archive
        # contract. Cheap (<1s) and catches regressions before E2E runs.
        run: |
          pip install pytest --break-system-packages
          python3 -m pytest tests/ -q

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + browsers
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests (desktop + mobile)
        # Sprint 65 (v31.7.153 — audit ChatGPT 2026-04-28 P1) — CI mobile activée.
        # Avant : seul chromium-desktop tournait. Or 60% du trafic est mobile.
        # Après : les 2 projets en parallèle, mobile catch les régressions
        # bottom-nav / drawer / modal / sub-nav scroll.
        run: npx playwright test --project=chromium-desktop --project=mobile-chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
