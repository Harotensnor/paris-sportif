name: Temporary YouTube tab recovery

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-tab-recovery.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare browser capture
        run: |
          node --version
          which google-chrome || which google-chrome-stable || which chromium || true
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core
          mkdir -p out/frames

      - name: Capture the tutorial frames from the embedded player
        shell: bash
        run: |
          cat > /tmp/capture.js <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          const id = 'ZRwvPScqEys';
          const out = 'out';
          const frameDir = `${out}/frames`;
          fs.mkdirSync(frameDir, { recursive: true });

          function findChrome() {
            const candidates = [
              '/usr/bin/google-chrome', '/usr/bin/google-chrome-stable',
              '/usr/bin/chromium', '/usr/bin/chromium-browser',
              '/opt/google/chrome/chrome'
            ];
            return candidates.find(p => fs.existsSync(p));
          }

          (async () => {
            const executablePath = findChrome();
            if (!executablePath) throw new Error('Chrome executable not found');
            const browser = await chromium.launch({
              executablePath,
              headless: true,
              args: [
                '--autoplay-policy=no-user-gesture-required',
                '--disable-blink-features=AutomationControlled',
                '--disable-dev-shm-usage',
                '--no-sandbox',
                '--window-size=1280,720'
              ]
            });
            const context = await browser.newContext({
              viewport: { width: 1280, height: 720 },
              locale: 'en-US',
              timezoneId: 'America/New_York',
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              extraHTTPHeaders: { 'Accept-Language': 'en-US,en;q=0.9' }
            });
            const page = await context.newPage();
            const logs = [];
            page.on('console', m => logs.push({ type: 'console', level: m.type(), text: m.text() }));
            page.on('pageerror', e => logs.push({ type: 'pageerror', text: String(e) }));
            page.on('requestfailed', r => logs.push({ type: 'requestfailed', url: r.url(), failure: r.failure() }));

            const urls = [
              `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1`,
              `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1`,
              `https://www.youtube.com/watch?v=${id}`
            ];

            let playable = false;
            let chosenUrl = null;
            let info = null;

            for (const url of urls) {
              logs.push({ type: 'navigate', url });
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(8000);
                await page.screenshot({ path: `${out}/attempt_${urls.indexOf(url)}.jpg`, type: 'jpeg', quality: 90 });
                info = await page.evaluate(() => {
                  const v = document.querySelector('video');
                  const body = document.body ? document.body.innerText.slice(0, 5000) : '';
                  return {
                    title: document.title,
                    url: location.href,
                    body,
                    video: v ? {
                      duration: Number.isFinite(v.duration) ? v.duration : null,
                      currentTime: v.currentTime,
                      paused: v.paused,
                      readyState: v.readyState,
                      networkState: v.networkState,
                      error: v.error ? { code: v.error.code, message: v.error.message } : null,
                      videoWidth: v.videoWidth,
                      videoHeight: v.videoHeight,
                      src: v.currentSrc || v.src || null
                    } : null
                  };
                });
                logs.push({ type: 'info', url, info });
                if (info.video && info.video.duration && info.video.readyState >= 1 && !info.video.error) {
                  playable = true;
                  chosenUrl = url;
                  break;
                }
              } catch (e) {
                logs.push({ type: 'attempt-error', url, text: String(e), stack: e.stack });
              }
            }

            fs.writeFileSync(`${out}/browser-log.json`, JSON.stringify(logs, null, 2));
            fs.writeFileSync(`${out}/player-info.json`, JSON.stringify({ playable, chosenUrl, info }, null, 2));

            if (playable) {
              const duration = Math.min(info.video.duration, 900);
              await page.evaluate(() => {
                const v = document.querySelector('video');
                if (v) { v.muted = true; v.pause(); }
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
              });

              // Seek at half-second intervals so every distinct tab overlay is captured.
              for (let t = 0; t <= duration + 0.001; t += 0.5) {
                try {
                  await page.evaluate(async (target) => {
                    const v = document.querySelector('video');
                    if (!v) throw new Error('video disappeared');
                    v.pause();
                    const done = new Promise(resolve => {
                      const timer = setTimeout(resolve, 2500);
                      v.addEventListener('seeked', () => { clearTimeout(timer); resolve(); }, { once: true });
                    });
                    v.currentTime = Math.min(target, Math.max(0, v.duration - 0.02));
                    await done;
                    await new Promise(r => setTimeout(r, 120));
                  }, t);
                  const name = String(Math.round(t * 2)).padStart(5, '0');
                  await page.screenshot({ path: `${frameDir}/frame_${name}_${t.toFixed(1)}s.jpg`, type: 'jpeg', quality: 92 });
                } catch (e) {
                  logs.push({ type: 'frame-error', t, text: String(e) });
                }
              }
              fs.writeFileSync(`${out}/browser-log.json`, JSON.stringify(logs, null, 2));
            }

            await browser.close();
          })().catch(err => {
            fs.writeFileSync('out/fatal.txt', String(err.stack || err));
            process.exitCode = 0;
          });
          JS
          node /tmp/capture.js
          find out -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | head -1000

      - name: Upload browser capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-tab-browser-capture-ZRwvPScqEys
          path: out/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
