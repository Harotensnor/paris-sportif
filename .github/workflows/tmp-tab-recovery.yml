name: Temporary original PDF recovery

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-tab-recovery.yml

permissions:
  contents: read

jobs:
  recover-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the creator's original TAB PDFs
        shell: bash
        run: |
          mkdir -p out_original
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -fL --retry 5 --max-time 90 -A "$UA" \
            'https://mitchgissendaner.com/wp-content/uploads/2023/04/Jump-in-the-Line1.pdf' \
            -o 'out_original/Jump-in-the-Line1-2023.pdf'
          curl -fL --retry 5 --max-time 90 -A "$UA" \
            'https://mitchgissendaner.com/wp-content/uploads/2021/10/Jump-in-the-Line1.pdf' \
            -o 'out_original/Jump-in-the-Line1-2021.pdf'
          file out_original/*
          sha256sum out_original/* | tee out_original/sha256.txt
          ls -lah out_original
      - name: Upload original TAB
        uses: actions/upload-artifact@v4
        with:
          name: original-jump-in-the-line-tab-pdfs
          path: out_original/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
