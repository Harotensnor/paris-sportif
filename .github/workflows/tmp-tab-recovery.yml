name: Temporary storyboard recovery

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-tab-recovery.yml

permissions:
  contents: read

jobs:
  storyboards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe and download YouTube storyboard sprites
        shell: bash
        run: |
          mkdir -p out_storyboards
          ID='ZRwvPScqEys'
          LOG=out_storyboards/status.tsv
          printf 'url\tstatus\ttype\tsize\n' > "$LOG"
          fetch() {
            url="$1"; name="$2"
            tmp="out_storyboards/$name"
            status=$(curl -L --max-time 20 --retry 2 -A 'Mozilla/5.0' -sS -w '%{http_code}' -o "$tmp" "$url" || true)
            type=$(file -b --mime-type "$tmp" 2>/dev/null || true)
            size=$(stat -c%s "$tmp" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\t%s\n' "$url" "$status" "$type" "$size" >> "$LOG"
            if [ "$status" != '200' ] || [ "$size" -lt 1000 ]; then rm -f "$tmp"; fi
          }
          for level in 0 1 2 3; do
            fetch "https://i.ytimg.com/sb/$ID/storyboard3_L${level}/default.jpg" "L${level}_default.jpg"
            for i in $(seq 0 30); do
              fetch "https://i.ytimg.com/sb/$ID/storyboard3_L${level}/M${i}.jpg" "L${level}_M${i}.jpg"
            done
          done
          for n in default 0 1 2 3 mqdefault hqdefault sddefault maxresdefault; do
            fetch "https://i.ytimg.com/vi/$ID/$n.jpg" "thumb_$n.jpg"
          done
          for sec in $(seq 0 3 300); do
            fetch "https://i.ytimg.com/an_webp/$ID/mqdefault_${sec}s.webp" "anim_${sec}s.webp"
          done
          cat "$LOG"
          find out_storyboards -type f -printf '%P %s bytes\n' | sort
      - name: Upload storyboard sprites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-storyboards-ZRwvPScqEys
          path: out_storyboards/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
