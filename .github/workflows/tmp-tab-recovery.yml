name: Build exact Guitar Pro tablature

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-tab-recovery.yml

permissions:
  contents: read

jobs:
  build-gp5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current PyGuitarPro
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Perlence/PyGuitarPro.git /tmp/PyGuitarPro
          python -m pip install --upgrade pip
          python -m pip install /tmp/PyGuitarPro

      - name: Generate and round-trip validate the exact GP5
        shell: bash
        run: |
          set -euxo pipefail
          python tmp/generate_jump_tab.py
          curl -fL --retry 5 --max-time 90 -A 'Mozilla/5.0' \
            'https://mitchgissendaner.com/wp-content/uploads/2023/04/Jump-in-the-Line1.pdf' \
            -o 'out_gp5/Jump_in_the_Line_original_Mitchs_Music.pdf'
          file out_gp5/*
          sha256sum out_gp5/* | tee out_gp5/sha256.txt
          ls -lah out_gp5

      - name: Upload final tablature
        uses: actions/upload-artifact@v4
        with:
          name: Jump-in-the-Line-exact-Guitar-Pro
          path: out_gp5/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
