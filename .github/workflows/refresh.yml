name: refresh-data

# Re-run every 5 minutes during active hours (10-23 UTC), every 30 minutes
# overnight (0-9 UTC). Reduces ~75% of CI minutes and commit noise during
# hours where few matches are live. Matches the site's prime-time window
# (late afternoon → late night Europe / daytime Americas).
# Client-side 60s poll + visibilitychange refresh keep the UX fresh.
on:
  schedule:
    - cron: '*/5 10-23 * * *'    # day: every 5 min (limite GitHub Actions)
    - cron: '*/15 0-9 * * *'     # night: every 15 min (was 30 — v33.7, mode plus 'live')
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # v33.26 — CRITICAL FIX : avant cancel-in-progress=true tuait chaque
    # run au tick suivant (car la pipeline complete prend ~6-8 min > cron 5min).
    # Résultat : 100% des runs étaient `cancelled`, data figée 14h+.
    # Maintenant cancel-in-progress=false → runs s'enfilent en queue.
    # Si la queue gonfle, augmenter le cron interval ; pour l'instant
    # GHA gère la queue OK avec le timeout-minutes:10 par run.
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pip-requirements.txt

      - name: Install deps
        run: pip install -r pip-requirements.txt --break-system-packages

      # v33.27 — PARALLÈLE : les fetchers indépendants tournent simultanément.
      # Avant : ~3min en séquentiel. Après : ~30-45s (limité par le plus lent).
      # Tous écrivent leur propre JSON, pas de race-condition possible.
      # Les patches restent séquentiels (eux écrivent tous data.js).
      - name: Fetch pipeline (parallèle)
        run: |
          cd scripts
          # Group A : fetchers heavy en parallèle (background avec &)
          (python3 fetch_live.py || true) > /tmp/fetch_live.log 2>&1 &
          PID_LIVE=$!
          (python3 fetch_sofascore_events.py || true) > /tmp/fetch_sofa.log 2>&1 &
          PID_SOFA=$!
          (python3 fetch_winamax_catalog.py || true) > /tmp/fetch_wnx.log 2>&1 &
          PID_WNX=$!
          (python3 fetch_h2h.py || true) > /tmp/fetch_h2h.log 2>&1 &
          PID_H2H=$!
          (python3 fetch_forebet.py || true) > /tmp/fetch_forebet.log 2>&1 &
          PID_FOREBET=$!
          (python3 fetch_tennis_odds.py || true) > /tmp/fetch_tennis.log 2>&1 &
          PID_TENNIS=$!
          (python3 fetch_rus_odds.py || true) > /tmp/fetch_rus.log 2>&1 &
          PID_RUS=$!
          (python3 fetch_injuries.py || true) > /tmp/fetch_inj.log 2>&1 &
          PID_INJ=$!
          (python3 fetch_clubelo.py || true) > /tmp/fetch_clubelo.log 2>&1 &
          PID_ELO=$!
          (python3 fetch_fbref_xg.py || true) > /tmp/fetch_xg.log 2>&1 &
          PID_XG=$!
          # Wait pour TOUS et imprime les logs (mêmes timeouts implicites = pas de limite ici)
          wait $PID_LIVE $PID_SOFA $PID_WNX $PID_H2H $PID_FOREBET $PID_TENNIS $PID_RUS $PID_INJ $PID_ELO $PID_XG
          echo "=== fetch_live ==="; cat /tmp/fetch_live.log | tail -3
          echo "=== fetch_sofascore ==="; cat /tmp/fetch_sofa.log | tail -3
          echo "=== fetch_winamax_catalog ==="; cat /tmp/fetch_wnx.log | tail -3
          echo "=== fetch_h2h ==="; cat /tmp/fetch_h2h.log | tail -2
          echo "=== fetch_clubelo ==="; cat /tmp/fetch_clubelo.log | tail -2
          # Snapshot odds + results (rapides, séquentiels après les fetchers)
          python3 patch_odds.py || true
          python3 snapshot_odds.py || true
          python3 snapshot_results.py || true
          # v33.27 — Group B : fetchers conditionnels en parallèle (cadences variables)
          MIN_MOD15=$(( $(date +%M) % 15 ))
          MIN_MOD30=$(( $(date +%M) % 30 ))
          MIN_MOD60=$(( $(date +%M) % 60 ))
          HOUR_MOD4=$(( $(date +%H) % 4 ))
          # fetch_tips: every 15min
          if [ $MIN_MOD15 -lt 5 ]; then
            (python3 fetch_tips.py || true) > /tmp/fetch_tips.log 2>&1 &
          fi
          # fetch_injuries_soccer + fetch_lineups_soccer: every 30min
          if [ $MIN_MOD30 -lt 5 ]; then
            (python3 fetch_injuries_soccer.py || true) > /tmp/fetch_inj_soc.log 2>&1 &
            (python3 fetch_lineups_soccer.py || true) > /tmp/fetch_lineups.log 2>&1 &
          fi
          # fetch_v3: every hour (full ESPN sweep)
          if [ $MIN_MOD60 -lt 5 ]; then
            (python3 fetch_v3.py || true) > /tmp/fetch_v3.log 2>&1 &
          fi
          # fetch_team_stats: every 4h (slow ~4min)
          if [ $HOUR_MOD4 -eq 0 ] && [ $MIN_MOD15 -lt 5 ]; then
            (python3 fetch_team_stats.py || true) > /tmp/fetch_ts.log 2>&1 &
          fi
          # fetch_team_form: every 30min
          if [ $MIN_MOD30 -lt 5 ]; then
            (python3 fetch_team_form.py || true) > /tmp/fetch_tf.log 2>&1 &
          fi
          # fetch_weather + fetch_referees + fetch_clubelo + fetch_fbref_xg : self-throttled, parallèle
          (python3 fetch_weather.py || true) > /tmp/fetch_weather.log 2>&1 &
          (python3 fetch_referees_soccer.py || true) > /tmp/fetch_refs.log 2>&1 &
          # Wait pour TOUS les jobs background lancés
          wait
          echo "=== fetch_weather ==="; cat /tmp/fetch_weather.log 2>/dev/null | tail -2 || true
          echo "=== fetch_referees ==="; cat /tmp/fetch_refs.log 2>/dev/null | tail -2 || true
          # Patches : SÉQUENTIELS (tous écrivent data.js → race-condition si parallèle)
          python3 patch_winamax.py || true
          # v33.0 — Merge Sofascore events dans data.js (dedup par home|away|day).
          # Doit tourner APRÈS patch_winamax pour préserver la cohérence
          # ESPN events (qui restent prioritaires). Ajoute ~1500 events/jour
          # supplémentaires couvrant plus de ligues + qualifs.
          python3 patch_sofascore_events.py || true
          # v28 — Patch multi-market odds (uses ev.winamax.match_id from patch_winamax).
          # Must run AFTER patch_winamax, BEFORE other patches that rewrite data.js.
          python3 patch_winamax_markets.py || true
          # Patch soccer injuries AFTER patch_winamax so they survive the
          # dedup/bucketing rewrite. Idempotent, ~0.1s.
          python3 patch_injuries_soccer.py || true
          # Patch team-stats AFTER patch_winamax for same reason (survives
          # competitor dedup). ~0.3s.
          python3 patch_team_stats.py || true
          # Patch lineups AFTER patch_winamax for same reason. ~0.1s.
          python3 patch_lineups_soccer.py || true
          # Patch ClubElo ratings last (survives all prior rewrites). ~0.1s.
          python3 patch_clubelo.py || true
          # v31.7.206 — Patch fbref xG : enrichit chaque foot competitor avec
          # xg_for_avg, xg_against_avg, matches_played. ~0.1s. Idempotent.
          python3 patch_fbref_xg.py || true
          # Patch weather (survives all prior rewrites). Adds ev.weather to
          # football events with a fresh forecast. ~0.1s.
          python3 patch_weather.py || true
          # Patch referees last (survives all prior rewrites). Adds
          # ev.referee to each top-5 soccer event. ~0.1s.
          python3 patch_referees_soccer.py || true
          # v30 — Inject team_form.json (last 5 W/L) into competitor.form
          # for NBA/NHL/MLB/NFL events. Idempotent, ~0.1s.
          python3 patch_team_form.py || true
          # v30 — Tennis Sackmann (ATP/WTA Elo + surface + fatigue). 24h
          # cache on the upstream CSVs ; safe to call every tick (typical
          # run < 1s when cache is warm).
          python3 fetch_tennis_sackmann.py || true
          python3 patch_tennis_features.py || true
          # v30 — Football-Data.co.uk (closing odds + league calibration).
          # 6h cache on the source CSVs.
          python3 fetch_footballdata.py || true
          python3 patch_footballdata.py || true
          # v30 — MLB probable pitchers (statsapi.mlb.com, no key, free).
          # Single biggest non-market signal in baseball : starting
          # pitcher ERA differential. 6h cache per pitcher.
          if [ $MIN_MOD15 -lt 5 ]; then
            python3 fetch_mlb_pitchers.py || true
          fi
          python3 patch_mlb_pitchers.py || true
          # v30 — NHL official API (api-web.nhle.com, no key, free).
          # Replaces MoneyPuck (Cloudflare-blocked). Team pace + starting
          # goalie SV%. 10min cache.
          if [ $MIN_MOD15 -lt 5 ]; then
            python3 fetch_nhl_stats.py || true
          fi
          python3 patch_nhl_stats.py || true
          # v31.7.37 — NBA team stats via ESPN public endpoint (PPG / pace
          # proxy / record / last10). 30min cache. Enrichit basketScoreProjection.
          if [ $MIN_MOD15 -lt 5 ]; then
            python3 fetch_nba_team_stats.py || true
          fi
          python3 patch_nba_team_stats.py || true
          # v33.28 — Inject data.js (window.PRONOSTICS_DATA = {...}) dans
          # pronostics.html UNE SEULE FOIS à la fin. Avant : 11 patches faisaient
          # ce regex sur 13500 lignes à chaque fois (~6-12s gaspillées par run).
          python3 inject_data_in_html.py || true
          # Build health.json — compact pipeline status snapshot. Visible at
          # https://harotensnor.github.io/paris-sportif/health.json so we can
          # spot stale/missing sources without scraping the workflow logs.
          python3 build_health.py || true
          # v31.7.23 — Mesure ρ Dixon-Coles par ligue via likelihood max.
          # Lent (~2-5s pour 40 ligues), tourne 1×/jour à minute=0 (cron).
          # Tant qu'une ligue n'a pas ≥40 matchs archivés, fallback litterature.
          if [ "$(date -u +'%H:%M')" = "00:00" ] || [ ! -f dixon_coles_rho.json ]; then
            python3 measure_dixon_coles_rho.py || true
          fi
          # v31.7.39 — Forces offensives/défensives Maher (1982) par ligue.
          # Output team_strengths.json. Tourne 1×/jour à 00:05 (5min après ρ).
          # ≥40 matchs/ligue requis sinon skip ligue. Activera au fil du temps.
          if [ "$(date -u +'%H:%M')" = "00:05" ] || [ ! -f team_strengths.json ]; then
            python3 measure_team_strengths.py || true
          fi
          # v31.7.63 — Full Bivariate Poisson MLE Dixon-Coles (α/β/γ/ρ joint).
          # Lent (~30s/ligue), tourne 1×/jour à 00:10 (10min après Maher V0).
          if [ "$(date -u +'%H:%M')" = "00:10" ] || [ ! -f team_strengths_mle.json ]; then
            python3 measure_team_strengths_mle.py || true
          fi
          # v31 — Static backtest page (audit ChatGPT recommandation). Lit
          # backtest_report_v2.json, produit backtest.html indexable sans JS.
          # Le JSON change ~1×/semaine donc le HTML aussi mais c'est cheap.
          python3 build_backtest_page.py || true
          # v31.7.29 — Patch les 4 stats hardcodées dans index.html depuis
          # backtest_report_v2.json (single source of truth). Cheap, idempotent.
          python3 patch_index_stats.py || true
          # v31 — RSS feed (top picks du jour). Lit data.js, produit feed.xml.
          python3 build_feed.py || true
          # v31 — Static credibilite.html (calibration + Brier + log-loss).
          python3 build_credibilite_page.py || true
          # v31.7.4 — OG images (1200x630 PNG) pour pages statiques. Cheap (~3s).
          python3 build_og_images.py || true
          # Chantier #3 lazy-load — DOIT tourner en DERNIER. Lit data.js (full),
          # écrit data_today.json + data_manifest.json + ré-inline LITE blob
          # dans pronostics.html. Réduit le 1er paint de ~1.4 MB à ~0.4 MB.
          python3 finalize_inline.py || true

      - name: Stamp asset versions in pronostics.html
        # v31.3 — Cache-busting basé sur le hash du contenu : `?v=<hash8>` pour
        # app.css et app.js dans pronostics.html. Le hash change UNIQUEMENT
        # quand le fichier change (vs un timestamp build qui changerait à
        # chaque tick et invaliderait le cache 288×/jour).
        # Les browsers respectent correctement le cache HTTP : si ?v= est
        # identique au précédent, ils servent depuis cache. Sinon, fresh.
        run: |
          APP_CSS_HASH=$(git hash-object app.css | head -c 8)
          APP_JS_HASH=$(git hash-object app.js | head -c 8)
          # Replace existing ?v=XXX or add it if missing
          sed -i -E "s|app\.css(\?v=[a-f0-9]+)?|app.css?v=${APP_CSS_HASH}|g" pronostics.html
          sed -i -E "s|app\.js(\?v=[a-f0-9]+)?|app.js?v=${APP_JS_HASH}|g" pronostics.html
          echo "Stamped: app.css?v=${APP_CSS_HASH}, app.js?v=${APP_JS_HASH}"

      - name: Stamp sw.js CACHE_VERSION
        # Bumps the service worker cache key on every deploy, so browsers fetch
        # the fresh pronostics.html + data.js instead of serving stale cache.
        # Only stamped when other files actually changed (see next step).
        run: |
          BUILD_ID=$(date -u +'%Y%m%d-%H%M%S')
          sed -i "s|^const CACHE_VERSION = .*|const CACHE_VERSION = 'paris-sportif-${BUILD_ID}';|" sw.js

      # AUDIT-2026-04-27 (Sprint 32 #37 + Sprint 45 #21) — Auto-rollback complet.
      # Si data.js a perdu >50% events vs HEAD~1, refuse le commit ENTIER
      # (pas juste data.js). Sinon les sidecars JSON modifiés sans data.js
      # cohérent créent un état incohérent pour le prochain run.
      - name: Check data integrity (auto-rollback if -50%)
        run: |
          if ! python3 scripts/check_data_integrity.py; then
            echo "::warning::data.js integrity check failed — reverting ALL changes"
            # Reset complet : annule TOUS les changements non-staged
            git checkout HEAD -- .
            # Skip le commit suivant en marquant un flag
            echo "ROLLBACK_TRIGGERED=1" >> $GITHUB_ENV
          fi
        continue-on-error: true

      # AUDIT-2026-04-27 (Sprint 32 #39 + Sprint 45 #22) — Backup quotidien.
      # Le script backup_data_snapshot.py est idempotent (si fichier du
      # jour existe, skip). Donc on peut l'appeler à chaque tick sans
      # risque de doublons. Évite le bug "skip si cron pas tick à 23:5x".
      - name: Daily data.js backup snapshot
        run: python3 scripts/backup_data_snapshot.py || true

      # AUDIT-2026-04-27 (Sprint 32 #38) — Health alerts via Discord.
      # Optional : tourne seulement si DISCORD_HEALTH_WEBHOOK secret set.
      - name: Notify health warnings (Discord opt-in)
        env:
          DISCORD_HEALTH_WEBHOOK: ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
        run: python3 scripts/notify_health_warnings.py || true

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js pronostics.html app.css app.js odds_history.jsonl \
                  injuries_soccer.json winamax_catalog.json winamax_markets.json team_stats.json \
                  lineups_soccer.json clubelo.json weather.json fbref_xg.json \
                  weather_geo_cache.json referees_soccer.json health.json \
                  data_today.json data_manifest.json team_form.json \
                  results_archive.jsonl tennis_ratings.json footballdata.json \
                  mlb_pitchers.json nhl_stats.json backtest.html feed.xml \
                  credibilite.html stadiums.json dixon_coles_rho.json index.html \
                  nba_team_stats.json team_strengths.json team_strengths_mle.json \
                  ci_heartbeat.json sofascore_events.json \
                  og-default.png og-backtest.png og-credibilite.png og-methodologie.png \
                  2>/dev/null || true
          # Sprint 45 #24 — archives/ retiré du git add : rolling local
          # 30j conservé hors versionning (cf .gitignore).
          # Only stamp sw.js if we have real content changes — otherwise
          # discard the version bump to avoid 288 empty commits/day.
          # v31.7.222 — Heartbeat safeguard (fix v31.7.221 qui utilisait `stat
          # -c %Y` = mtime fichier, lequel est mis à NOW à chaque `git checkout`
          # sur GHA → STALENESS toujours ~0 → heartbeat ne déclenche jamais).
          # Maintenant on lit le `tick` field DANS le JSON pour avoir le vrai
          # timestamp du dernier write réel.
          if git diff --cached --quiet; then
            NOW=$(date +%s)
            HEARTBEAT_FILE="ci_heartbeat.json"
            STALENESS=99999
            if [ -f "$HEARTBEAT_FILE" ]; then
              # Extract `tick` field from JSON (number, no quotes around it).
              # Falls back to 0 if missing or unparseable → triggers heartbeat.
              LAST_HB=$(grep -oE '"tick":\s*[0-9]+' "$HEARTBEAT_FILE" 2>/dev/null | grep -oE '[0-9]+' | head -1)
              if [ -n "$LAST_HB" ]; then
                STALENESS=$((NOW - LAST_HB))
              fi
            fi
            if [ $STALENESS -gt 1800 ]; then
              echo "Heartbeat trigger — last tick was ${STALENESS}s ago (>1800s threshold)."
              echo "{\"tick\":$NOW,\"reason\":\"heartbeat-no-content-diff\",\"date\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > "$HEARTBEAT_FILE"
              git add "$HEARTBEAT_FILE"
            else
              git checkout -- sw.js
              echo "No content changes (last heartbeat tick ${STALENESS}s ago) — sw.js stamp reverted."
              exit 0
            fi
          fi
          git add sw.js
          git commit -m "data: auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Retry on race conditions: when a manual push or another cron run
          # advances main between checkout and push, naive `git push` hits
          # non-fast-forward. Pull --rebase the autostash and retry up to 3x.
          # `git pull` works with fetch-depth: 1 because we only need to
          # rebase a handful of commits ahead.
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling --rebase and retrying."
            git pull --rebase --autostash origin main
          done
          echo "Push still failing after 3 retries — surfacing as a job failure."
          exit 1
