name: refresh-data

# Re-run every 5 minutes. GitHub Pages auto-deploys every commit, so the
# live site updates within ~1 minute of each push. Combined with the
# client-side 60s poll, Théo sees fresh odds within ~6 min at worst.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: refresh-data
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch pipeline
        run: |
          set -e
          cd scripts
          python3 fetch_live.py || true      # today only, ~15s
          python3 patch_odds.py || true      # normalize ESPN odds
          python3 fetch_tennis_odds.py || true
          python3 fetch_rus_odds.py || true
          python3 fetch_injuries.py || true
          python3 fetch_h2h.py || true       # head-to-head histories
          python3 snapshot_odds.py || true   # freeze pre-match odds (persist post-match for bilan)
          python3 patch_winamax.py || true
          # Every 12th tick (= 1h), also run full sweep so tomorrow+ stays fresh
          if [ $(( $(date +%M) % 60 )) -lt 5 ]; then
            python3 fetch_v3.py || true
            python3 fetch_tips.py || true
            python3 fetch_forebet.py || true
            python3 patch_winamax.py || true
          fi

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js pronostics.html odds_history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
