name: refresh-data

# Re-run every 5 minutes during active hours (10-23 UTC), every 30 minutes
# overnight (0-9 UTC). Reduces ~75% of CI minutes and commit noise during
# hours where few matches are live. Matches the site's prime-time window
# (late afternoon → late night Europe / daytime Americas).
# Client-side 60s poll + visibilitychange refresh keep the UX fresh.
on:
  schedule:
    - cron: '*/5 10-23 * * *'    # day: every 5 min (limite GitHub Actions)
    # v54.1 — Cron night ajusté à 10min (v53.6 essayait 5min mais le pipeline
    # prenait ~5min → 2 runs concurrents → race git push → "Pipeline en panne".
    # 10min laisse marge confortable + concurrency group ci-dessous évite
    # tout overlap résiduel.
    - cron: '*/10 0-9 * * *'     # night: every 10 min
  workflow_dispatch: {}

# v54.1 — Concurrency lock : un seul run de refresh-data à la fois.
# Empêche 2 ticks cron qui se chevauchent de race sur git push.
concurrency:
  group: paris-sportif-refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # v33.29 — Bumped 10→15 min : avec la pipeline élargie (Sofa multi-sport,
    # 18 patches, fbref/MLB/NHL fetches), des runs touchaient le cap 10 min
    # → cancelled au timeout. 15 min laisse de la marge sans risquer 5x runs
    # qui s'accumulent (cron tick = 5 min, chaque run finit avant 2 ticks).
    timeout-minutes: 15
    # v33.26 — CRITICAL FIX : avant cancel-in-progress=true tuait chaque
    # run au tick suivant (car la pipeline complete prend ~6-8 min > cron 5min).
    # Résultat : 100% des runs étaient `cancelled`, data figée 14h+.
    # Maintenant cancel-in-progress=false → runs s'enfilent en queue.
    # Si la queue gonfle, augmenter le cron interval ; pour l'instant
    # GHA gère la queue OK avec le timeout-minutes:10 par run.
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs keep the SHA they were queued with. With a 5min cron
          # and data commits every run, that stale SHA can be behind main by the
          # time the job actually starts. Always checkout the live branch head.
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pip-requirements.txt

      - name: Install deps
        run: pip install -r pip-requirements.txt --break-system-packages

      # AUDIT 2026-05-08 v40 — winamax_markets.json (~90 MB) externalisé
      # sur GitHub Releases (rolling tag `data-cache`). Restore au boot
      # pour que fetch_winamax_match_details puisse merger sur l'existant
      # (TTL respecté). No-op silencieux si la release est absente.
      - name: Restore winamax_markets cache from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_winamax_markets_release.py download || true

      # v33.27 — PARALLÈLE : les fetchers indépendants tournent simultanément.
      # Avant : ~3min en séquentiel. Après : ~30-45s (limité par le plus lent).
      # Tous écrivent leur propre JSON, pas de race-condition possible.
      # Les patches restent séquentiels (eux écrivent tous data.js).
      - name: Fetch pipeline (parallèle)
        run: |
          cd scripts
          # Group A : fetchers heavy en parallèle (background avec &)
          (python3 fetch_live.py || true) > /tmp/fetch_live.log 2>&1 &
          PID_LIVE=$!
          (python3 fetch_sofascore_events.py || true) > /tmp/fetch_sofa.log 2>&1 &
          PID_SOFA=$!
          (python3 fetch_winamax_catalog.py || true) > /tmp/fetch_wnx.log 2>&1 &
          PID_WNX=$!
          (python3 fetch_h2h.py || true) > /tmp/fetch_h2h.log 2>&1 &
          PID_H2H=$!
          (python3 fetch_forebet.py || true) > /tmp/fetch_forebet.log 2>&1 &
          PID_FOREBET=$!
          (python3 fetch_tennis_odds.py || true) > /tmp/fetch_tennis.log 2>&1 &
          PID_TENNIS=$!
          (python3 fetch_rus_odds.py || true) > /tmp/fetch_rus.log 2>&1 &
          PID_RUS=$!
          (python3 fetch_injuries.py || true) > /tmp/fetch_inj.log 2>&1 &
          PID_INJ=$!
          (python3 fetch_clubelo.py || true) > /tmp/fetch_clubelo.log 2>&1 &
          PID_ELO=$!
          (python3 fetch_understat_xg.py || true) > /tmp/fetch_xg.log 2>&1 &
          PID_XG=$!
          (python3 fetch_fbref_xg.py || true) > /tmp/fetch_fbref_xg.log 2>&1 &
          PID_FBREF_XG=$!
          # Wait pour TOUS et imprime les logs (mêmes timeouts implicites = pas de limite ici)
          wait $PID_LIVE $PID_SOFA $PID_WNX $PID_H2H $PID_FOREBET $PID_TENNIS $PID_RUS $PID_INJ $PID_ELO $PID_XG $PID_FBREF_XG
          echo "=== fetch_live ==="; cat /tmp/fetch_live.log | tail -3
          echo "=== fetch_sofascore ==="; cat /tmp/fetch_sofa.log | tail -3
          echo "=== fetch_winamax_catalog ==="; cat /tmp/fetch_wnx.log | tail -3
          echo "=== fetch_h2h ==="; cat /tmp/fetch_h2h.log | tail -2
          echo "=== fetch_clubelo ==="; cat /tmp/fetch_clubelo.log | tail -2
          echo "=== fetch_fbref_xg ==="; cat /tmp/fetch_fbref_xg.log | tail -2
          # Snapshot odds + results (rapides, séquentiels après les fetchers)
          python3 patch_odds.py || true
          python3 snapshot_odds.py || true
          python3 detect_smart_money.py || true
          python3 snapshot_results.py || true
          # v33.27 — Group B : fetchers conditionnels en parallèle (cadences variables)
          MIN_MOD15=$(( $(date +%M) % 15 ))
          MIN_MOD30=$(( $(date +%M) % 30 ))
          MIN_MOD60=$(( $(date +%M) % 60 ))
          HOUR_MOD4=$(( $(date +%H) % 4 ))
          # fetch_tips: every 15min
          if [ $MIN_MOD15 -lt 5 ]; then
            (python3 fetch_tips.py || true) > /tmp/fetch_tips.log 2>&1 &
          fi
          # fetch_injuries_soccer + fetch_lineups_soccer: every 30min
          if [ $MIN_MOD30 -lt 5 ]; then
            (python3 fetch_injuries_soccer.py || true) > /tmp/fetch_inj_soc.log 2>&1 &
            (python3 fetch_lineups_soccer.py || true) > /tmp/fetch_lineups.log 2>&1 &
          fi
          # fetch_v3: every hour, and immediately if data.js is already stale.
          # BUG-006 (2026-05-08): the fatal freshness guard runs every tick, but
          # fetch_v3 was only hourly. If the hour run is cancelled or queued too
          # long, every non-hour run fails freshness without even attempting a
          # full rebuild. Force the sweep once data.js crosses the same 30 min
          # threshold used by check_pipeline_freshness.py.
          DATA_AGE_MIN=$(python3 - <<'PY'
          import datetime as dt
          import pathlib
          import re

          path = pathlib.Path('../data.js')
          try:
              text = path.read_text(encoding='utf-8', errors='ignore')
              match = re.search(r'"generated_at"\s*:\s*"([^"]+)"', text)
              if not match:
                  raise ValueError('generated_at missing')
              generated = dt.datetime.fromisoformat(match.group(1).replace('Z', '+00:00'))
              now = dt.datetime.now(dt.timezone.utc)
              print(max(0, int((now - generated).total_seconds() // 60)))
          except Exception:
              print(99999)
          PY
          )
          echo "data.js age before fetch_v3: ${DATA_AGE_MIN}min"
          if [ $MIN_MOD60 -lt 5 ] || [ "${DATA_AGE_MIN:-99999}" -gt 30 ]; then
            (python3 fetch_v3.py || true) > /tmp/fetch_v3.log 2>&1 &
          fi
          # fetch_team_stats: every 4h (slow ~4min)
          if [ $HOUR_MOD4 -eq 0 ] && [ $MIN_MOD15 -lt 5 ]; then
            (python3 fetch_team_stats.py || true) > /tmp/fetch_ts.log 2>&1 &
          fi
          # fetch_team_form: every 30min
          if [ $MIN_MOD30 -lt 5 ]; then
            (python3 fetch_team_form.py || true) > /tmp/fetch_tf.log 2>&1 &
          fi
          # TheSportsDB metadata: public free API, self-throttled 24h TTL.
          if [ $HOUR_MOD4 -eq 0 ] && [ $MIN_MOD15 -lt 5 ]; then
            (python3 fetch_thesportsdb_meta.py || true) > /tmp/fetch_tsdb.log 2>&1 &
          fi
          # OpenLigaDB: public German football cross-check, self-throttled 12h TTL.
          if [ $HOUR_MOD4 -eq 0 ] && [ $MIN_MOD30 -lt 5 ]; then
            (python3 fetch_openligadb.py || true) > /tmp/fetch_openligadb.log 2>&1 &
          fi
          # fetch_weather + fetch_referees + fetch_clubelo + fetch_understat_xg : self-throttled, parallèle
          (python3 fetch_weather.py || true) > /tmp/fetch_weather.log 2>&1 &
          (python3 fetch_referees_soccer.py || true) > /tmp/fetch_refs.log 2>&1 &
          # Wait pour TOUS les jobs background lancés
          wait
          echo "=== fetch_weather ==="; cat /tmp/fetch_weather.log 2>/dev/null | tail -2 || true
          echo "=== fetch_referees ==="; cat /tmp/fetch_refs.log 2>/dev/null | tail -2 || true
          # Patches : SÉQUENTIELS (tous écrivent data.js → race-condition si parallèle)
          # v33.30 — Patches "lourds" qui ont une logique spécifique (dedup,
          # multi-market lookup, merge events). Restent en scripts séparés.
          python3 patch_sofascore_events.py || true
          python3 patch_sofascore_league_codes.py || true
          # v35.36 — Sofascore merge can add non-exact fallback events. Filter
          # after the merge so the served dataset remains Winamax-exact only.
          python3 patch_winamax.py || true
          python3 patch_winamax_markets.py || true
          # v35.26 — Top-up léger des pages match Winamax à CHAQUE refresh.
          # Le catalog tournament garde le 1N2, puis ce passage remplit
          # progressivement O/U, handicaps, BTTS, score exact, totals, etc.
          # AUDIT 2026-05-08 v39.2 — TTL baissé 1h → 0.5h pour valider plus
          # agressivement les cotes des marchés secondaires. User feedback :
          # "je veux pas de paris à cote pas validée". Le frontend filtre
          # désormais sur v38OddTopEligible — donc plus on valide vite, plus
          # de picks sont visibles dans le dashboard.
          WINAMAX_DETAILS_CAP=400 WINAMAX_DETAILS_SLEEP=0.10 python3 fetch_winamax_match_details.py --limit 400 --ttl-hours 0.5 --horizon-days 30 || true
          python3 patch_winamax_markets.py || true
          # v33.30 — Fetchers pour données qu'on patchera ensuite via patch_all_quick.
          python3 fetch_tennis_sackmann.py || true
          python3 fetch_footballdata.py || true
          if [ $MIN_MOD15 -lt 5 ]; then
            python3 fetch_mlb_pitchers.py || true
            # v53.4 — Statcast pitcher metrics (xwOBA, K%, barrel%, exit velo)
            python3 fetch_baseball_savant.py || true
            python3 fetch_nhl_stats.py || true
            python3 fetch_nba_team_stats.py || true
            # v52.5 — Advanced team stats (NBA eFG/AST/TO, MLB OPS/runs, NHL
            # PP%/PK%/FOW%) qui activent les 3 branches dead du frontend
            # (legacy-app.js v51.6).
            python3 fetch_advanced_stats.py --sport all || true
            # v35 — Markets étendus Winamax multi-sports (foot, tennis,
            # basket, baseball, hockey, MMA) sur le pool exact priorisé.
            # Tourne toutes les 15 min, après que patch_winamax_markets a
            # mis match_id sur les events ESPN.
            # v39.2 : limite augmentée 900 → 1000 + TTL 0.5h pour mieux
            # rattraper les cotes "à vérifier".
            WINAMAX_DETAILS_CAP=1000 WINAMAX_DETAILS_SLEEP=0.10 python3 fetch_winamax_match_details.py --limit 1000 --ttl-hours 0.5 --horizon-days 30 || true
            python3 patch_winamax_markets.py || true   # re-patch pour appliquer les nouveaux markets
          fi
          # v33.30 — MEGA-PATCHER : applique 13 enrichissements légers en
          # 1 seule lecture/écriture data.js. Avant : 13 invocations Python
          # × ~2-3s chacune = ~30s. Maintenant : 1 invocation × ~0.5s.
          # (weather, referees, lineups, injuries, clubelo, team_form,
          #  fbref_xg, team_stats, footballdata, mlb_pitchers, nhl_stats,
          #  nba_team_stats, tennis_features)
          python3 patch_all_quick.py || true
          python3 patch_understat_xg.py || true
          python3 patch_fbref_xg.py || true
          # v52.5 — Inject NBA/MLB/NHL advanced team stats sur competitor.{nba,mlb,nhl}_advanced
          python3 patch_advanced_stats.py || true
          python3 patch_smart_money.py || true
            python3 build_public_team_stats.py || true
            python3 build_lineups_multisport.py || true
            PUBLIC_SOURCE_MIN_INTERVAL=0.18 python3 fetch_public_match_signals.py --limit 120 --include-past-minutes 1440 --player-limit 180 || true
            python3 patch_public_match_signals.py || true
            python3 build_xg_coverage.py || true
            python3 build_public_profiles.py || true
            python3 fetch_match_previews.py --limit 12 || true
            python3 build_league_bias_audit.py || true
            python3 build_betting_intelligence.py || true
            python3 build_market_auc.py || true
            python3 build_backtest_training_rows.py || true
            # v37.025 — Multi-strategy backtest + Monte Carlo drawdown.
            # Reads picks_history.jsonl, writes backtest_strategies.json
            # consumed by Performance > Stratégies tab. Keep || true so a
            # transient empty history file doesn't kill the cron.
            python3 backtest_strategies.py || true
            # v37.028 — Tier calibration: WR/ROI vs implied per tier badge.
            # Surfaces overconfident tiers (safe / solid currently lose money)
            # to the UI so users see the historical reality next to the badge.
            python3 build_tier_calibration.py || true
            # v37.029 — Probability calibration map (histogram binning,
            # 10 bins). Surfaces the systematic overconfidence at low
            # odds. Helper exposed at runtime; not yet plumbed into
            # predictMatch (separate chantier).
            python3 build_prob_calibration.py || true
            # v37.033 — stamp footer/shell version label from latest commit.
            python3 stamp_version.py || true
            python3 train_lightgbm.py || true
            python3 build_lightgbm_runtime.py || true
            python3 audit_lightgbm_runtime.py || true
            python3 build_rugby_markets.py || true
          python3 build_niche_markets.py || true
          python3 build_mlb_player_props.py || true
          python3 build_nhl_playoff_markets.py || true
          python3 build_tennis_challenger_watchlist.py || true
          python3 build_football_expansion_watchlist.py || true
          python3 build_sports_expansion_audit.py || true
          python3 build_sports_coverage_extended.py || true
          python3 detect_boosted_odds.py || true
          python3 build_anti_public_angles.py || true
          python3 build_schedule_spots_summary.py || true
          python3 build_rare_signal_summary.py || true
          python3 apply_data_lineage.py || true
          # v33.28 — Inject data.js (window.PRONOSTICS_DATA = {...}) dans
          # pronostics.html UNE SEULE FOIS à la fin. Avant : 11 patches faisaient
          # ce regex sur 13500 lignes à chaque fois (~6-12s gaspillées par run).
          python3 inject_data_in_html.py || true
          # Build health.json — compact pipeline status snapshot. Visible at
          # https://harotensnor.github.io/paris-sportif/health.json so we can
          # spot stale/missing sources without scraping the workflow logs.
          python3 build_health.py || true
          # v35.405 — Single source of truth for Winamax ratios. Measure the
          # all-events night snapshot, rebuild health with explicit scopes,
          # then fail if data.js/night_metrics/health disagree silently.
          python3 measure_night_metrics.py || true
          python3 build_health.py || true
          python3 audit_data_truth.py || true
          python3 validate_data_quality.py || true
          python3 data_integrity_monitor.py || true
          python3 build_health.py || true
          # v35.403 — MCP diagnostics guard. The desktop connector can point to
          # a historical script path locally, so sync that copy when present and
          # smoke-test that `today` is dynamic even if data buckets are stale.
          python3 sync_mcp_shadow_copy.py || true
          python3 audit_mcp_shadow_copy.py || true
          python3 test_mcp_smoke.py || true
          # v35.336 — Report all remaining signal blind spots by match/league.
          # This makes missing lineups/injuries/referee/H2H/xG actionable
          # without reading workflow logs.
          python3 build_signal_gap_report.py || true
          # v33.32 — Compute Closing Line Value depuis odds_history.jsonl
          # Mesure si on bat le marché (cote bouge en notre faveur après
          # qu'on ait pris la cote). Cheap (~1s sur 450 matches).
          python3 build_picks_history.py || true
          python3 build_team_priors.py || true
          python3 build_bayesian_priors_v5.py || true
          python3 build_stacking_meta_v5.py || true
          python3 build_feature_engineering_v5.py || true
          python3 detect_feature_drift_v5.py || true
          python3 build_calibration_method_v5.py || true
          python3 build_adaptive_ensemble_v5.py || true
          python3 build_cold_start_v5.py || true
          python3 build_multitask_v5.py || true
          python3 build_backtest_deep_v5.py || true
          python3 build_adversarial_validation_v5.py || true
          python3 build_model_versions_v5.py || true
          python3 build_season_phase.py || true
          python3 build_star_players.py || true
          python3 build_xg_decay_params.py || true
          python3 build_travel_schedule_context.py || true
          python3 build_referee_stats.py || true
          python3 build_role_context.py || true
          python3 build_stadium_effects.py || true
          python3 build_coach_tenure.py || true
          python3 build_derbies.py || true
          python3 build_team_stats_extended_v4.py || true
          python3 build_football_player_props.py || true
          python3 build_nba_player_props.py || true
          python3 build_football_stats_markets.py || true
          python3 benchmark_model_v4.py || true
          python3 build_model_anomalies.py || true
          python3 snapshot_pick_odds.py || true
          python3 compute_clv.py || true
          python3 settle_picks.py || true
          # v35.420 — Briefing quotidien local depuis les sidecars deja
          # construits. Aucune source externe: juste synthese actionnable UI.
          python3 build_daily_insights.py || true
          # v31.7.23 — Mesure ρ Dixon-Coles par ligue via likelihood max.
          # Lent (~2-5s pour 40 ligues), tourne 1×/jour à minute=0 (cron).
          # Tant qu'une ligue n'a pas ≥40 matchs archivés, fallback litterature.
          if [ "$(date -u +'%H:%M')" = "00:00" ] || [ ! -f dixon_coles_rho.json ]; then
            python3 measure_dixon_coles_rho.py || true
          fi
          # v31.7.39 — Forces offensives/défensives Maher (1982) par ligue.
          # Output team_strengths.json. Tourne 1×/jour à 00:05 (5min après ρ).
          # ≥40 matchs/ligue requis sinon skip ligue. Activera au fil du temps.
          if [ "$(date -u +'%H:%M')" = "00:05" ] || [ ! -f team_strengths.json ]; then
            python3 measure_team_strengths.py || true
          fi
          # v31.7.63 — Full Bivariate Poisson MLE Dixon-Coles (α/β/γ/ρ joint).
          # Lent (~30s/ligue), tourne 1×/jour à 00:10 (10min après Maher V0).
          if [ "$(date -u +'%H:%M')" = "00:10" ] || [ ! -f team_strengths_mle.json ]; then
            python3 measure_team_strengths_mle.py || true
          fi
          # v31 — Static backtest page (audit ChatGPT recommandation). Lit
          # backtest_report_v2.json, produit backtest.html indexable sans JS.
          # Le JSON change ~1×/semaine donc le HTML aussi mais c'est cheap.
          python3 build_backtest_page.py || true
          # v31.7.29 — Patch les 4 stats hardcodées dans index.html depuis
          # backtest_report_v2.json (single source of truth). Cheap, idempotent.
          python3 patch_index_stats.py || true
          # v31 — RSS feed (top picks du jour). Lit data.js, produit feed.xml.
          python3 build_feed.py || true
          # v31 — Static credibilite.html (calibration + Brier + log-loss).
          python3 build_credibilite_page.py || true
          # AUDIT 2026-05-08 — segment_trust.json synthèse ROI/WR par
          # sport/ligue/cote_bucket/tier depuis backtest_report_v2.json.
          # Frontend l'utilise pour annoter chaque pick avec un signal
          # "✓ segment validé +X%" / "⚠ segment perdant -Y%". ~15 KB.
          python3 build_segment_trust.py || true
          # AUDIT 2026-05-08 v39.3 — Détecte les incohérences cotes :
          # vig anormale, cotes extrêmes, contradictions BTTS vs Poisson
          # 1n2+OU. Sortie prono_consistency_report.json (~5-15 KB).
          python3 audit_prono_consistency.py || true
          # v31.7.4 — OG images (1200x630 PNG) pour pages statiques. Cheap (~3s).
          python3 build_og_images.py || true
          # v35.13 — Sitemap dynamique depuis git log + routes SPA principales.
          python3 build_sitemap.py || true
          # Chantier #3 lazy-load — DOIT tourner en DERNIER. Lit data.js (full),
          # écrit data_today.json + data_manifest.json + ré-inline LITE blob
          # dans pronostics.html. Réduit le 1er paint de ~1.4 MB à ~0.4 MB.
          python3 finalize_inline.py || true
          python3 check_pipeline_health.py --max-age-min 30
          python3 check_pipeline_freshness.py --max-age-min 30
          # AUDIT 2026-05-08 v40 — Push winamax_markets.json (~90 MB) sur
          # GitHub Releases (tag rolling `data-cache`). Plus commité dans
          # git (cf .gitignore + git rm --cached). Le prochain run cron
          # restaure depuis la release au boot.
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" python3 sync_winamax_markets_release.py upload || true
          # v35.407 — Bundle guard: app.js must stay below 1.6 MB after the
          # V36/V37 cleanup. Fails fast if a sprint reintroduces dead code.
          python3 audit_bundle_size.py
          # v35.92 — Alertes Discord Big Bets imminents. No-op sans secret
          # DISCORD_WEBHOOK_URL, dédup et cap 3 alertes/2h côté script.
          python3 notify_discord.py || true
          python3 notify_discord_health.py || true

      - name: Stamp asset versions in pronostics.html
        # Cache-busting basé sur le hash du contenu : `?v=<hash8>` pour tous
        # les assets locaux référencés par pronostics.html. Le hash change
        # uniquement quand le fichier change, donc les sidecars et modules
        # évoluent sans servir de cache stale.
        run: |
          APP_VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          m = re.search(r"VERSION\s*=\s*['\"](v\d+(?:\.\d+)?)['\"]", Path('app.js').read_text(encoding='utf-8', errors='ignore'))
          print(m.group(1) if m else 'v0')
          PY
          )
          BUILD_ID="${APP_VERSION}-$(date -u +'%Y%m%d-%H%M%S')"
          echo "ASSET_BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"
          python3 scripts/stamp_asset_hashes.py --build-id "$BUILD_ID"
          python3 scripts/audit_asset_hashes.py

      - name: Stamp sw.js CACHE_VERSION
        # Bumps the service worker cache key on every deploy, so browsers fetch
        # the fresh pronostics.html + data.js instead of serving stale cache.
        # Only stamped when other files actually changed (see next step).
        run: |
          BUILD_ID="${ASSET_BUILD_ID:-v0-$(date -u +'%Y%m%d-%H%M%S')}"
          sed -i "s|^const CACHE_VERSION = .*|const CACHE_VERSION = 'paris-sportif-${BUILD_ID}';|" sw.js

      # AUDIT-2026-04-27 (Sprint 32 #37 + Sprint 45 #21) — Auto-rollback complet.
      # Si data.js a perdu >50% events vs HEAD~1, refuse le commit ENTIER
      # (pas juste data.js). Sinon les sidecars JSON modifiés sans data.js
      # cohérent créent un état incohérent pour le prochain run.
      - name: Check data integrity (auto-rollback if -50%)
        run: |
          if ! python3 scripts/check_data_integrity.py; then
            echo "::warning::data.js integrity check failed — reverting ALL changes"
            # Reset complet : annule TOUS les changements non-staged
            git checkout HEAD -- .
            # Skip le commit suivant en marquant un flag
            echo "ROLLBACK_TRIGGERED=1" >> $GITHUB_ENV
          fi
        continue-on-error: true

      # AUDIT-2026-04-27 (Sprint 32 #39 + Sprint 45 #22) — Backup quotidien.
      # Le script backup_data_snapshot.py est idempotent (si fichier du
      # jour existe, skip). Donc on peut l'appeler à chaque tick sans
      # risque de doublons. Évite le bug "skip si cron pas tick à 23:5x".
      - name: Daily data.js backup snapshot
        run: python3 scripts/backup_data_snapshot.py || true

      # AUDIT-2026-04-27 (Sprint 32 #38) — Health alerts via Discord.
      # Optional : tourne seulement si DISCORD_HEALTH_WEBHOOK secret set.
      - name: Notify health warnings (Discord opt-in)
        env:
          DISCORD_HEALTH_WEBHOOK: ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
        run: python3 scripts/notify_health_warnings.py || true

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add only files that exist. A missing optional sidecar (ex: fbref_xg.json)
          # used to make the whole `git add ... || true` no-op, so data.js stayed
          # fresh in the runner but never reached main.
          for path in \
            data.js data_lite.js pronostics.html app.css app.js odds_history.jsonl \
            injuries_soccer.json injuries_multisport.json winamax_catalog.json team_stats.json \
            lineups_soccer.json lineups_multisport.json xg_coverage.json match_previews.json clubelo.json weather.json fbref_xg.json xg_team_stats.json \
            weather_geo_cache.json referees_soccer.json health.json night_metrics.json \
            data_today.json data_manifest.json team_form.json form_stats_extended.json h2h_extended.json \
            thesportsdb_meta.json openligadb_matches.json public_team_stats.json public_team_profiles.json public_player_profiles.json \
            league_inefficiencies.json market_biases_by_league.json detected_angles.json anti_public_angles.json schedule_spots_summary.json rare_signals.json rare_signal_summary.json timing_edges.json \
            daily_insights.json \
            market_auc_report.json \
            backtest_training_rows.jsonl backtest_training_rows_summary.json \
            lightgbm_weights.json lightgbm_weights.js \
            rugby_markets.json niche_markets.json mlb_player_props.json nhl_playoff_markets.json tennis_challenger_watchlist.json football_expansion_watchlist.json sports_expansion_audit.json \
            boosted_odds.json \
            results_archive.jsonl tennis_ratings.json.gz footballdata.json.gz \
            bayesian_priors.json.gz team_priors.json.gz team_form.json.gz \
            mlb_pitchers.json baseball_savant.json nhl_stats.json backtest.html feed.xml \
            credibilite.html stadiums.json dixon_coles_rho.json index.html \
            nba_team_stats.json nba_advanced.json mlb_advanced.json nhl_advanced.json team_strengths.json team_strengths_mle.json \
            ci_heartbeat.json sofascore_events.json clv_history.json clv_summary.json \
            og-default.png og-backtest.png og-credibilite.png og-methodologie.png sitemap.xml
          do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          # Sprint 45 #24 — archives/ retiré du git add : rolling local
          # 30j conservé hors versionning (cf .gitignore).
          # Only stamp sw.js if we have real content changes — otherwise
          # discard the version bump to avoid 288 empty commits/day.
          # v31.7.222 — Heartbeat safeguard (fix v31.7.221 qui utilisait `stat
          # -c %Y` = mtime fichier, lequel est mis à NOW à chaque `git checkout`
          # sur GHA → STALENESS toujours ~0 → heartbeat ne déclenche jamais).
          # Maintenant on lit le `tick` field DANS le JSON pour avoir le vrai
          # timestamp du dernier write réel.
          if git diff --cached --quiet; then
            NOW=$(date +%s)
            HEARTBEAT_FILE="ci_heartbeat.json"
            STALENESS=99999
            if [ -f "$HEARTBEAT_FILE" ]; then
              # Extract `tick` field from JSON (number, no quotes around it).
              # Falls back to 0 if missing or unparseable → triggers heartbeat.
              LAST_HB=$(grep -oE '"tick":\s*[0-9]+' "$HEARTBEAT_FILE" 2>/dev/null | grep -oE '[0-9]+' | head -1)
              if [ -n "$LAST_HB" ]; then
                STALENESS=$((NOW - LAST_HB))
              fi
            fi
            if [ $STALENESS -gt 1800 ]; then
              echo "Heartbeat trigger — last tick was ${STALENESS}s ago (>1800s threshold)."
              echo "{\"tick\":$NOW,\"reason\":\"heartbeat-no-content-diff\",\"date\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > "$HEARTBEAT_FILE"
              git add "$HEARTBEAT_FILE"
            else
              git checkout -- sw.js
              echo "No content changes (last heartbeat tick ${STALENESS}s ago) — sw.js stamp reverted."
              exit 0
            fi
          fi
          git add sw.js
          git commit -m "data: auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Retry on race conditions: when a manual push or another cron run
          # advances main between checkout and push, naive `git push` hits
          # non-fast-forward. Rebase with the generated snapshot winning
          # conflicts; otherwise two successive data commits conflict on every
          # one-line JSON file and leave the workflow red even though the data
          # was refreshed correctly.
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling --rebase and retrying."
            git pull --rebase --autostash -X theirs origin main
          done
          echo "Push still failing after 3 retries — surfacing as a job failure."
          exit 1
