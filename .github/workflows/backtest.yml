name: backtest-v2

# v45.17 : QUOTIDIEN à 04:00 UTC (06:00 Paris) — user feedback "647 picks
# réglés depuis longtemps sa a pas bougé". Avant : hebdo dimanche → n_total
# n'incrémentait qu'1×/sem alors que les matchs se règlent en continu.
# Daily est OK : workflow ~1-3 min, fenêtre calme avant refresh-data.
#
# Ce workflow évalue la VRAIE fonction predictMatch (depuis app.js + legacy)
# via mini-racer — pas une baseline de marché, pas une duplication Python.
# Une seule source de vérité : pronostics.html / app.js / legacy-app.js.
#
# Le rapport (backtest_report_v2.{json,md}) est committé dans le repo pour
# que Théo puisse le lire directement sur GitHub/GH Pages.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backtest-v2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # mini-racer = V8 embarqué pour appeler predictMatch depuis Python.
        # --break-system-packages : pattern déjà utilisé par refresh.yml
        # sur l'image ubuntu-latest (Python managé par apt).
        run: pip install mini-racer --break-system-packages

      - name: Run backtest v2
        run: python3 scripts/backtest_v2.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_report_v2.json backtest_report_v2.md calibration_per_sport_league.json calibration_per_sport_league_market.json bankroll_simulation.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to backtest report — skipping commit."
            exit 0
          fi
          git commit -m "backtest: weekly v2 refresh $(date -u +'%Y-%m-%d UTC')"
          git push
