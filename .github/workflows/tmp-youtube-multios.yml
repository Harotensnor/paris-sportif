name: Temporary multi-OS YouTube video recovery

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-youtube-multios.yml

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current yt-dlp
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]"
          mkdir -p out

      - name: Try multiple YouTube clients
        shell: bash
        run: |
          set +e
          URL='https://www.youtube.com/watch?v=ZRwvPScqEys'
          python - <<'PY'
          import os, platform, json
          with open('out/environment.json','w') as f:
              json.dump({'platform':platform.platform(),'runner_os':os.environ.get('RUNNER_OS'),'runner_arch':os.environ.get('RUNNER_ARCH')},f,indent=2)
          PY
          clients=(
            'default:'
            'web:youtube:player_client=web'
            'web_safari:youtube:player_client=web_safari'
            'mweb:youtube:player_client=mweb'
            'android_vr:youtube:player_client=android_vr'
            'ios:youtube:player_client=ios'
            'tv:youtube:player_client=tv'
            'web_embedded:youtube:player_client=web_embedded'
          )
          success=''
          for item in "${clients[@]}"; do
            name="${item%%:*}"
            args="${item#*:}"
            echo "===== $name =====" | tee -a out/summary.txt
            if [[ -n "$args" ]]; then
              yt-dlp -v --no-playlist --js-runtimes node --remote-components ejs:github \
                --impersonate chrome --socket-timeout 30 --retries 5 --fragment-retries 5 \
                --extractor-args "$args" \
                -f 'worst[ext=mp4]/worstvideo[ext=mp4]/worstvideo' \
                -o "out/source_${name}.%(ext)s" "$URL" \
                >"out/${name}.stdout.log" 2>"out/${name}.stderr.log"
            else
              yt-dlp -v --no-playlist --js-runtimes node --remote-components ejs:github \
                --impersonate chrome --socket-timeout 30 --retries 5 --fragment-retries 5 \
                -f 'worst[ext=mp4]/worstvideo[ext=mp4]/worstvideo' \
                -o "out/source_${name}.%(ext)s" "$URL" \
                >"out/${name}.stdout.log" 2>"out/${name}.stderr.log"
            fi
            rc=$?
            echo "$name rc=$rc" | tee -a out/summary.txt
            tail -n 50 "out/${name}.stderr.log" >> out/summary.txt || true
            if find out -maxdepth 1 -type f -name "source_${name}.*" | grep -q .; then
              success="$name"
              break
            fi
          done
          echo "success=$success" >> out/summary.txt
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || ls -l out
          exit 0

      - name: Upload attempt
        uses: actions/upload-artifact@v4
        with:
          name: youtube-recovery-${{ matrix.os }}
          path: out/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
