name: fast-refresh
# v53.2 — Pipeline rapide focus sur les cotes Winamax et ESPN scoreboard.
# Tourne en parallèle de refresh.yml (cron 5min). Cible <2min pour passer
# la cible "fraîcheur <10min E2E" pour l'user, en dépit du minimum cron 5min
# imposé par GitHub Actions.
#
# Couvre uniquement : fetch_live + fetch_winamax_match_details (cotes
# secondaires) + patch_winamax_markets + finalize_inline + commit.
# Les enrichissements lents (clubelo, fbref, weather, lineups) restent
# dans refresh.yml.

on:
  schedule:
    - cron: '*/5 10-23 * * *'   # même cadence que refresh.yml mais offset naturel
  workflow_dispatch:

concurrency:
  group: paris-sportif-fast-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: pip install --quiet curl-cffi requests

      - name: Pull latest data.js (avoid stomping)
        run: git pull --rebase --strategy-option=theirs origin main || true

      - name: Fetch live + Winamax exact odds
        run: |
          set +e
          python3 scripts/fetch_live.py || true
          # Cap réduit pour rester rapide : 200 events les + proches.
          WINAMAX_DETAILS_CAP=200 WINAMAX_DETAILS_SLEEP=0.05 python3 scripts/fetch_winamax_match_details.py --limit 200 --ttl-hours 0.4 --horizon-days 7 || true

      - name: Patch Winamax + finalize
        run: |
          python3 scripts/patch_winamax.py || true
          python3 scripts/patch_winamax_markets.py || true
          python3 scripts/finalize_inline.py || true

      - name: Stamp + commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stamp asset hashes if app.js changed (rare in fast-tick)
          if git diff --quiet -- app.js app.css; then :; else
            APP_CSS_HASH=$(git hash-object app.css | head -c 8)
            APP_JS_HASH=$(git hash-object app.js | head -c 8)
            sed -i -E "s|app\.css(\?v=[a-f0-9]+)?|app.css?v=${APP_CSS_HASH}|g" pronostics.html
            sed -i -E "s|app\.js(\?v=[a-f0-9]+)?|app.js?v=${APP_JS_HASH}|g" pronostics.html
          fi
          for path in data.js data_lite.js pronostics.html; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "No data delta — fast-tick noop"
            exit 0
          fi
          git commit -m "data: fast-refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main || git pull --rebase --strategy-option=theirs origin main && git push origin main || true
