name: Recover exact tutorial audio through public YouTube frontends

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-audio-recover.yml

permissions:
  contents: read

jobs:
  recover-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade requests
          mkdir -p out/responses

      - name: Probe current Invidious and Piped instances, then download audio
        shell: bash
        run: |
          cat > /tmp/recover.py <<'PY'
          from __future__ import annotations
          import json, os, re, sys, time
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          VIDEO_ID = 'ZRwvPScqEys'
          OUT = Path('out')
          OUT.mkdir(exist_ok=True)
          (OUT / 'responses').mkdir(exist_ok=True)
          log = []
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          })

          def safe_name(s: str) -> str:
              return re.sub(r'[^A-Za-z0-9._-]+', '_', s)[:140]

          def get_json(url: str, timeout: int = 16):
              try:
                  r = session.get(url, timeout=timeout, allow_redirects=True)
                  log.append({'op':'json','url':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'type':r.headers.get('content-type')})
                  if r.status_code == 200 and 'json' in (r.headers.get('content-type') or '').lower():
                      return r.json()
              except Exception as e:
                  log.append({'op':'json','url':url,'error':repr(e)})
              return None

          def download(url: str, label: str, headers=None) -> bool:
              try:
                  h = {'Referer': 'https://www.youtube.com/'}
                  if headers: h.update(headers)
                  with session.get(url, headers=h, timeout=45, stream=True, allow_redirects=True) as r:
                      log.append({'op':'download','label':label,'url':url[:1000],'status':r.status_code,'final':r.url[:1000],'type':r.headers.get('content-type'),'length':r.headers.get('content-length')})
                      if r.status_code not in (200, 206):
                          return False
                      path = OUT / 'tutorial-source.bin'
                      total = 0
                      with path.open('wb') as f:
                          for chunk in r.iter_content(1024 * 256):
                              if not chunk: continue
                              f.write(chunk); total += len(chunk)
                              if total > 200 * 1024 * 1024: break
                      if total < 10000:
                          path.unlink(missing_ok=True)
                          return False
                      (OUT / 'success-source.txt').write_text(label + '\n' + r.url, encoding='utf-8')
                      return True
              except Exception as e:
                  log.append({'op':'download','label':label,'url':url[:1000],'error':repr(e)})
                  return False

          # ---- Invidious ----
          invidious = get_json('https://api.invidious.io/instances.json', 25)
          inv_uris = []
          if isinstance(invidious, list):
              (OUT / 'invidious-instances.json').write_text(json.dumps(invidious, indent=2), encoding='utf-8')
              for entry in invidious:
                  try:
                      host, meta = entry
                      if not isinstance(meta, dict) or not meta.get('api'): continue
                      uri = meta.get('uri') or ('https://' + host)
                      if uri.startswith('https://') and '.onion' not in uri and '.i2p' not in uri:
                          inv_uris.append(uri.rstrip('/'))
                  except Exception: pass
          inv_uris += [
              'https://yewtu.be','https://inv.nadeko.net','https://invidious.nerdvpn.de',
              'https://invidious.private.coffee','https://iv.datura.network','https://invidious.fdn.fr',
              'https://invidious.privacyredirect.com','https://invidious.protokolla.fi',
              'https://inv.us.projectsegfau.lt','https://invidious.materialio.us',
          ]
          seen=set(); inv_uris=[u for u in inv_uris if not (u in seen or seen.add(u))]

          for i, base in enumerate(inv_uris[:70], 1):
              for local in ('true','false'):
                  api = f'{base}/api/v1/videos/{VIDEO_ID}?local={local}'
                  data = get_json(api)
                  if not isinstance(data, dict): continue
                  (OUT/'responses'/f'invidious_{i}_{safe_name(base)}_{local}.json').write_text(json.dumps(data, indent=2), encoding='utf-8')
                  formats = data.get('adaptiveFormats') or []
                  audio = [f for f in formats if str(f.get('type','')).startswith('audio/') or str(f.get('mimeType','')).startswith('audio/')]
                  audio.sort(key=lambda f: int(f.get('bitrate') or 0), reverse=True)
                  for f in audio[:4]:
                      url=f.get('url')
                      if url and download(url, f'Invidious {base} local={local}'):
                          json.dump(log, (OUT/'network-log.json').open('w'), indent=2)
                          sys.exit(0)

          # ---- Piped ----
          piped_lists = [
              'https://piped.video/api/v1/instances',
              'https://piped-instances.kavin.rocks/',
              'https://raw.githubusercontent.com/wiki/TeamPiped/Piped-Frontend/Instances.md',
          ]
          piped_apis=[]
          for u in piped_lists[:2]:
              data=get_json(u,25)
              if data is not None:
                  (OUT/f'piped-list-{safe_name(u)}.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
              if isinstance(data,list):
                  for item in data:
                      if isinstance(item,dict):
                          api=item.get('api_url') or item.get('api') or item.get('apiUrl')
                          if api and str(api).startswith('https://'): piped_apis.append(str(api).rstrip('/'))
          piped_apis += [
              'https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de',
              'https://pipedapi.reallyaweso.me','https://pipedapi.leptons.xyz',
              'https://pipedapi.r4fo.com','https://pipedapi-libre.kavin.rocks',
              'https://api.piped.projectsegfau.lt','https://pipedapi.owo.si',
          ]
          seen=set(); piped_apis=[u for u in piped_apis if not (u in seen or seen.add(u))]
          for i, base in enumerate(piped_apis[:80],1):
              data=get_json(f'{base}/streams/{VIDEO_ID}',20)
              if not isinstance(data,dict): continue
              (OUT/'responses'/f'piped_{i}_{safe_name(base)}.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
              streams=data.get('audioStreams') or []
              streams.sort(key=lambda f:int(f.get('bitrate') or 0),reverse=True)
              for f in streams[:5]:
                  url=f.get('url')
                  if url and download(url,f'Piped {base}'):
                      json.dump(log,(OUT/'network-log.json').open('w'),indent=2)
                      sys.exit(0)

          json.dump(log, (OUT/'network-log.json').open('w'), indent=2)
          (OUT/'failure.txt').write_text('No current Invidious or Piped instance yielded the tutorial audio.', encoding='utf-8')
          sys.exit(1)
          PY
          python /tmp/recover.py

      - name: Normalize and inspect recovered audio
        shell: bash
        run: |
          set -euxo pipefail
          file out/tutorial-source.bin | tee out/file.txt
          ffprobe -v error -show_format -show_streams -of json out/tutorial-source.bin > out/ffprobe.json
          ffmpeg -hide_banner -loglevel error -y -i out/tutorial-source.bin -vn -ac 2 -ar 44100 -c:a pcm_s16le out/tutorial.wav
          ffmpeg -hide_banner -loglevel error -y -i out/tutorial-source.bin -vn -c:a libmp3lame -b:a 192k out/tutorial.mp3
          ffmpeg -hide_banner -loglevel error -y -i out/tutorial.wav \
            -filter_complex 'showwavespic=s=1800x500:colors=black' -frames:v 1 out/waveform.png
          ls -lah out

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jump-in-the-Line-public-frontend-audio-recovery
          path: out/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
