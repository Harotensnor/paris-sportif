name: Recover exact tutorial audio with YouTube PO tokens

on:
  push:
    branches:
      - tmp-tab-recovery-zrwvp-scqeys
    paths:
      - .github/workflows/tmp-audio-recover.yml

permissions:
  contents: read

jobs:
  recover-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install current yt-dlp, PO-token provider and audio tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'yt-dlp[default,curl-cffi]' bgutil-ytdlp-pot-provider
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci
          npx tsc
          mkdir -p "$GITHUB_WORKSPACE/out/logs"

      - name: Start local PO-token provider
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/bgutil/server
          nohup node build/main.js --port 4416 > "$GITHUB_WORKSPACE/out/logs/bgutil-server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/out/bgutil.pid"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:4416/ > "$GITHUB_WORKSPACE/out/bgutil-health.json"; then
              exit 0
            fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/out/logs/bgutil-server.log"
          exit 1

      - name: Download exact public tutorial audio
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          URL='https://www.youtube.com/watch?v=ZRwvPScqEys'
          COMMON=(
            --no-playlist
            --js-runtimes node
            --remote-components ejs:github
            --socket-timeout 30
            --retries 10
            --fragment-retries 10
            --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416'
            --impersonate chrome
            --write-info-json
            --write-thumbnail
            -f 'bestaudio/best'
            -o 'out/source.%(ext)s'
          )

          : > out/attempts.txt
          SUCCESS=''
          attempt() {
            local name="$1"; shift
            echo "===== $name =====" | tee -a out/attempts.txt
            yt-dlp -v "${COMMON[@]}" "$@" "$URL" \
              > "out/logs/${name}.stdout.log" 2> "out/logs/${name}.stderr.log"
            local rc=$?
            echo "return_code=$rc" | tee -a out/attempts.txt
            tail -n 80 "out/logs/${name}.stderr.log" >> out/attempts.txt || true
            if find out -maxdepth 1 -type f -name 'source.*' ! -name '*.json' ! -name '*.webp' ! -name '*.jpg' ! -name '*.png' | grep -q .; then
              SUCCESS=1
              return 0
            fi
            return $rc
          }

          attempt default || true
          [[ -n "$SUCCESS" ]] || attempt web_clients --extractor-args 'youtube:player_client=web_safari,web;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' || true
          [[ -n "$SUCCESS" ]] || attempt tv_clients --extractor-args 'youtube:player_client=tv,android_vr;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' || true
          [[ -n "$SUCCESS" ]] || attempt ios_clients --extractor-args 'youtube:player_client=ios,web_embedded;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' || true
          [[ -n "$SUCCESS" ]] || attempt mweb_client --extractor-args 'youtube:player_client=mweb;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' || true

          if [[ -z "$SUCCESS" ]]; then
            echo 'All yt-dlp + PO-token attempts failed.' > out/failure.txt
            exit 1
          fi

      - name: Normalize and inspect recovered audio
        shell: bash
        run: |
          set -euxo pipefail
          INPUT=$(find out -maxdepth 1 -type f -name 'source.*' ! -name '*.json' ! -name '*.webp' ! -name '*.jpg' ! -name '*.png' | head -n 1)
          file "$INPUT" | tee out/file.txt
          ffprobe -v error -show_format -show_streams -of json "$INPUT" > out/ffprobe.json
          ffmpeg -hide_banner -loglevel error -y -i "$INPUT" -vn -ac 2 -ar 44100 -c:a pcm_s16le out/tutorial.wav
          ffmpeg -hide_banner -loglevel error -y -i "$INPUT" -vn -c:a libmp3lame -b:a 192k out/tutorial.mp3
          ffmpeg -hide_banner -loglevel error -y -i out/tutorial.wav \
            -filter_complex 'showwavespic=s=1800x500:colors=black' -frames:v 1 out/waveform.png
          ls -lah out

      - name: Upload recovered reference audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jump-in-the-Line-tutorial-audio-PO-token
          path: out/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
