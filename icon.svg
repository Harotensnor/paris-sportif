<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Pronos data-driven">
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6a0ff"/>
      <stop offset="50%" stop-color="#7a72ff"/>
      <stop offset="100%" stop-color="#2dd4a8"/>
    </linearGradient>
    <linearGradient id="bg-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1f2c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4a8" stop-opacity=".0"/>
      <stop offset="50%" stop-color="#2dd4a8" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#2dd4a8" stop-opacity=".0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond gradient sombre -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)"/>

  <!-- Subtil grid d'arrière-plan -->
  <g opacity=".05" stroke="#b6a0ff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Élément central : courbe ROI ascendante stylisée + flèche -->
  <g transform="translate(256 256)">
    <!-- Cercle externe avec gradient brand -->
    <circle r="172" fill="none" stroke="url(#brand-grad)" stroke-width="3" opacity=".30"/>
    <circle r="140" fill="none" stroke="url(#brand-grad)" stroke-width="4" opacity=".50"/>

    <!-- Courbe ROI : sparkline ascendante traversant le centre -->
    <path d="M -116 64 L -76 32 L -36 48 L 4 -8 L 44 -28 L 84 -64 L 124 -88"
          fill="none" stroke="url(#brand-grad)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Flèche au bout (haut droit) -->
    <path d="M 124 -88 L 96 -100 M 124 -88 L 112 -60"
          fill="none" stroke="url(#brand-grad)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Points data sur la courbe -->
    <circle cx="-76" cy="32" r="7" fill="#2dd4a8"/>
    <circle cx="4" cy="-8" r="7" fill="#b6a0ff"/>
    <circle cx="84" cy="-64" r="7" fill="#f59e0b"/>
  </g>

  <!-- Ligne accent décorative en haut -->
  <line x1="80" y1="80" x2="432" y2="80" stroke="url(#accent-line)" stroke-width="2"/>

  <!-- Wordmark "PRONOS" en bas -->
  <text x="256" y="466" text-anchor="middle"
        fill="#f1f3f9"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="56" font-weight="800" letter-spacing="6">PRONOS</text>
</svg>
